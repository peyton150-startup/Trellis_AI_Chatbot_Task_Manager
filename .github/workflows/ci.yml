  t19-reliability:
    name: T19 timeout retry degraded state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned backend dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -r backend/requirements.txt

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start PostgreSQL and apply migration
        run: docker compose up -d --wait

      - name: Prove timeout and post-commit degraded-state behavior
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json

          from fastapi.testclient import TestClient
          from pydantic_ai.messages import ModelRequest, ToolReturnPart
          from pydantic_ai.models.function import DeltaToolCall, FunctionModel

          from app import agent as agent_module
          from app import sql
          from app.db import pool
          from app.main import app


          PROMPT = "Create a task called T19 Forced Timeout"
          CALL_ID = "call-t19-create-0001"
          model_calls = []


          def reset():
              model_calls.clear()
              with pool.connection() as conn:
                  conn.execute(sql.TRUNCATE_ALL_STATE)
                  conn.commit()


          def body(message=PROMPT):
              return {
                  "threadId": "client-owned-thread",
                  "runId": "client-owned-run",
                  "state": None,
                  "messages": [
                      {
                          "id": "m1",
                          "role": "user",
                          "content": message,
                      }
                  ],
                  "tools": [],
                  "context": [],
                  "forwardedProps": {},
              }


          def sse(text):
              return [
                  json.loads(line[6:])
                  for line in text.splitlines()
                  if line.startswith("data: ")
              ]


          async def post_commit_timeout(messages, _info):
              model_calls.append(list(messages))

              tool_completed = any(
                  isinstance(part, ToolReturnPart)
                  for message in messages
                  if isinstance(message, ModelRequest)
                  for part in message.parts
              )

              if tool_completed:
                  raise TimeoutError("forced provider timeout after commit")

              yield {
                  0: DeltaToolCall(
                      name="create_task",
                      json_args=json.dumps(
                          {"title": "T19 Forced Timeout"}
                      ),
                      tool_call_id=CALL_ID,
                  )
              }


          client = TestClient(app)

          print("[1] timeout after committed mutation")
          reset()

          agent_module.get_agent = lambda: agent_module.build_agent(
              FunctionModel(
                  stream_function=post_commit_timeout,
                  model_name="t19-post-commit-timeout",
              )
          )

          response = client.post("/api/agui", json=body())

          assert response.status_code == 200, response.text

          events = sse(response.text)
          kinds = [event["type"] for event in events]

          assert "TOOL_CALL_RESULT" in kinds, kinds
          assert "RUN_ERROR" in kinds, kinds
          assert "RUN_FINISHED" not in kinds, kinds

          assert (
              "At least one task change was committed, but the assistant response "
              "could not finish."
              in response.text
          ), response.text

          with pool.connection() as conn:
              tasks = conn.execute(
                  "SELECT title FROM tasks ORDER BY created_at"
              ).fetchall()

              invocations = conn.execute(
                  """
                  SELECT tool_name, status
                  FROM tool_invocations
                  ORDER BY created_at
                  """
              ).fetchall()

              task_events = conn.execute(
                  """
                  SELECT operation
                  FROM task_events
                  ORDER BY created_at
                  """
              ).fetchall()

              run = conn.execute(
                  """
                  SELECT status, error
                  FROM agent_runs
                  """
              ).fetchone()

              conn.commit()

          assert [row["title"] for row in tasks] == [
              "T19 Forced Timeout"
          ], tasks

          completed_creates = [
              row
              for row in invocations
              if row["tool_name"] == "create_task"
              and row["status"] == "completed"
          ]

          assert len(completed_creates) == 1, invocations
          assert [row["operation"] for row in task_events] == [
              "created"
          ], task_events

          assert run["status"] == "failed", run
          assert "mutation_committed=true" in run["error"], run
          assert "forced provider timeout after commit" in run["error"], run

          # Initial model request plus the failed post-tool model request.
          assert len(model_calls) == 2, len(model_calls)

          print("  PASS mutation committed exactly once")
          print("  PASS run remains FAILED")
          print("  PASS durable error records mutation_committed=true")
          print("  PASS deterministic degraded RUN_ERROR reached client")
          print("  PASS the whole user request was not replayed")


          print("[2] timeout before any mutation")
          reset()


          async def pre_commit_timeout(messages, _info):
              model_calls.append(list(messages))
              raise TimeoutError("forced provider timeout before commit")

              if False:
                  yield ""


          agent_module.get_agent = lambda: agent_module.build_agent(
              FunctionModel(
                  stream_function=pre_commit_timeout,
                  model_name="t19-pre-commit-timeout",
              )
          )

          response = client.post(
              "/api/agui",
              json=body("Create a task that must never commit"),
          )

          assert response.status_code == 200, response.text

          events = sse(response.text)
          kinds = [event["type"] for event in events]

          assert "RUN_ERROR" in kinds, kinds

          with pool.connection() as conn:
              task_count = conn.execute(
                  "SELECT count(*) AS n FROM tasks"
              ).fetchone()["n"]

              event_count = conn.execute(
                  "SELECT count(*) AS n FROM task_events"
              ).fetchone()["n"]

              invocation_count = conn.execute(
                  "SELECT count(*) AS n FROM tool_invocations"
              ).fetchone()["n"]

              run = conn.execute(
                  """
                  SELECT status, error
                  FROM agent_runs
                  """
              ).fetchone()

              conn.commit()

          assert task_count == 0
          assert event_count == 0
          assert invocation_count == 0
          assert run["status"] == "failed", run
          assert "forced provider timeout before commit" in run["error"], run
          assert "mutation_committed=true" not in run["error"], run

          print("  PASS pre-commit timeout mutated nothing")
          print("  PASS pre-commit timeout remains ordinary FAILED run")
          print()
          print("PASS T19 deterministic degraded-state gate")
          PY

      - name: Verify bounded provider policy and frontend error refetch
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          source = Path("backend/app/agent.py").read_text(encoding="utf-8")

          required = [
              "_MODEL_REQUEST_MAX_RETRIES = 2",
              "max_concurrency=1",
              "timeout=settings.model_timeout_seconds",
              "tool_timeout=settings.tool_timeout_seconds",
              "max_retries=_MODEL_REQUEST_MAX_RETRIES",
          ]

          for fragment in required:
              if fragment not in source:
                  raise SystemExit(
                      f"T19 backend reliability wiring is missing {fragment!r}"
                  )

          print("PASS bounded provider retry, timeout, tool timeout, and one-run concurrency wiring")
          PY

          node --input-type=module <<'JS'
          import fs from "node:fs";

          const chat = fs.readFileSync(
            "frontend/components/Chat.tsx",
            "utf8",
          );

          const requireMatch = (pattern, message) => {
            if (!pattern.test(chat)) {
              throw new Error(message);
            }
          };

          requireMatch(
            /onError\s*:\s*\(\)\s*=>\s*\{[\s\S]*?onRunComplete\s*\(\s*\)/,
            "RUN_ERROR must trigger the authoritative board refetch callback",
          );

          requireMatch(
            /useAuiEvent\s*\(\s*["']thread\.runEnd["'][\s\S]*?onRunComplete\s*\(/,
            "successful thread.runEnd must still trigger the board refetch callback",
          );

          console.log(
            "PASS both successful runs and RUN_ERROR refresh authoritative board state",
          );
          JS

      - name: Run non-network backend suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: pytest -m "not network"

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Remove CI database resources
        if: always()
        run: docker compose down -v

  t16-approval-bridge:
    name: T16 approval bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned backend dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -r backend/requirements.txt

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start PostgreSQL and apply migration
        run: docker compose up -d --wait

      - name: Prove the approval bridge executes and commits the deletion
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: pytest tests/test_approval_bridge.py -v

      - name: Prove the client-side approval surface is single and authoritative
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          # The defect T16 fixes was a second approval control that answered the
          # framework interrupt without persisting a decision. Grep is the right
          # instrument here: the property is "no other component dispatches an
          # approval", and that is a statement about the whole tree rather than
          # about the behaviour of any one component a unit test could mount.

          if grep -rn "respondToApproval\|resume?.(\|addResult?.(" \
              --include=*.tsx --include=*.ts \
              components lib app \
            | grep -v "^components/tool-fallback.tsx"; then
            echo "FAIL a component outside tool-fallback.tsx answers the interrupt directly"
            exit 1
          fi

          # tool-fallback.tsx may still export the generated approval bar, but it
          # must not mount it. A mounted bar is the bypass.
          if grep -n "<ToolFallbackApproval" components/tool-fallback.tsx; then
            echo "FAIL tool-fallback.tsx mounts the non-authoritative approval bar"
            exit 1
          fi

          # The authoritative decision request has to exist and has to be the
          # thing useRun calls before it submits the continuation.
          grep -q "approvals/" lib/api.ts \
            || { echo "FAIL api.ts has no approval decision request"; exit 1; }
          grep -q "postApprovalDecision" lib/useRun.ts \
            || { echo "FAIL useRun.ts does not post the decision"; exit 1; }
          grep -q "submitInterruptResponses" lib/useRun.ts \
            || { echo "FAIL useRun.ts does not submit the continuation"; exit 1; }

          # Ordering, checked structurally: the POST must appear before the
          # continuation submission inside decide().
          post_line=$(grep -n "await postApprovalDecision" lib/useRun.ts | cut -d: -f1)
          resume_line=$(grep -n "await submitInterruptResponses" lib/useRun.ts | cut -d: -f1)
          if [ "$post_line" -ge "$resume_line" ]; then
            echo "FAIL the continuation is submitted before the decision is persisted"
            exit 1
          fi

          echo "PASS one authoritative approval surface, decision persisted before continuation"

      - name: Run non-network backend suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: pytest -m "not network"

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Remove CI database resources
        if: always()
        run: docker compose down -v

  t17-cross-turn-continuity:
    name: T17 cross-turn continuity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned backend dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -r backend/requirements.txt

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start PostgreSQL and apply migration
        run: docker compose up -d --wait

      - name: Prove T17 clarification and server-owned cross-turn continuity
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: |
          python -m ruff check app/prompts.py app/agent.py app/runs.py app/sql.py tests/test_t17_continuity.py
          pytest tests/test_t17_continuity.py -v

      - name: Prove the frontend D-67 continuity boundary
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'const CONTINUITY_KEY = "trellisContinuityRunId"' lib/TrellisHttpAgent.ts \
            || { echo "FAIL missing frozen D-67 continuity key"; exit 1; }

          grep -Fq 'override run(input: RunAgentInput)' lib/TrellisHttpAgent.ts \
            || { echo "FAIL TrellisHttpAgent does not intercept final AG-UI input"; exit 1; }

          grep -Fq 'forwardedProps[CONTINUITY_KEY] = continuityRunId' lib/TrellisHttpAgent.ts \
            || { echo "FAIL continuity locator is not top-level forwardedProps"; exit 1; }

          # D-76 moved this assignment out of `run()` into the pure
          # `trellisForwardedProps` helper, so the value is now a parameter
          # rather than `this.continuityRunId`. The property this step
          # asserts is unchanged: the frozen D-67 key is assigned at the top
          # level of the forwarded properties from Trellis-owned state.
          grep -Fq 'trellisForwardedProps(' lib/TrellisHttpAgent.ts \
            || { echo "FAIL the forwarded-property assembly helper is gone"; exit 1; }

          grep -Fq 'new TrellisHttpAgent({' components/Chat.tsx \
            || { echo "FAIL Chat bypasses TrellisHttpAgent"; exit 1; }

          grep -Fq 'detail.status === "completed"' components/Chat.tsx \
            || { echo "FAIL continuity is not gated by completed server status"; exit 1; }

          grep -Fq 'agent.setContinuityRunId(runId)' components/Chat.tsx \
            || { echo "FAIL completed run id is not promoted"; exit 1; }

          if grep -Fq 'new HttpAgent({' components/Chat.tsx; then
            echo "FAIL Chat directly constructs HttpAgent"
            exit 1
          fi

          echo "PASS D-67 frontend continuity boundary"

      - name: Run cumulative non-network backend suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: pytest -m "not network"

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Remove CI database resources
        if: always()
        run: docker compose down -v

  t00w-linear-webhook-bridge:
    name: T00W Linear webhook bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned backend dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -r backend/requirements.txt

      # The positive proof D-69 deferred until the implementation existed. This
      # gate asserts what T00W DOES; the T00L gate asserts what nothing may do.
      #
      # Runs with no Linear credential, no network, and no live workspace. Every
      # provider call is driven through httpx.MockTransport, and the webhook path
      # makes no outbound call at all by design, so there is nothing here that a
      # secret would enable. The empty environment values are the assertion: if
      # any path silently required a credential, this step would fail rather than
      # skip.
      - name: Verify the provider boundary is credential-free and offline
        working-directory: backend
        env:
          LINEAR_CLIENT_ID: ""
          LINEAR_CLIENT_SECRET: ""
          LINEAR_WEBHOOK_SECRET: ""
          LINEAR_ALLOWED_USER_ID: ""
          TRELLIS_PUBLIC_ORIGIN: ""
        run: python -m pytest tests/test_linear_provider.py -q

      - name: Start PostgreSQL and apply 001 then 002 then 003
        run: docker compose up -d --wait

      - name: Verify the T00W transport schema
        shell: bash
        run: |
          set -euo pipefail

          tables="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT string_agg(tablename, ',' ORDER BY tablename) FROM pg_tables WHERE schemaname = 'public' AND tablename LIKE 'linear_%';"; } | tr -d '\r')"
          test "$tables" = "linear_agent_inbox,linear_agent_sessions,linear_installations,linear_oauth_states,linear_projections,linear_task_state"

          # The single ACTIVE installation rule is a database guarantee, so it is
          # proven by making it fail rather than by reading the index definition.
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis -c \
            "INSERT INTO linear_installations (organization_id, oauth_client_id, app_user_id, allowed_linear_user_id, access_token, access_token_expires_at, granted_scopes) VALUES ('o','c','a','u','t', now() + interval '1 day', 's');"

          if docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis -c \
            "INSERT INTO linear_installations (organization_id, oauth_client_id, app_user_id, allowed_linear_user_id, access_token, access_token_expires_at, granted_scopes) VALUES ('o2','c2','a2','u2','t2', now() + interval '1 day', 's');" ; then
            echo "FAIL: a second ACTIVE installation was accepted"
            exit 1
          fi

          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis -c \
            "TRUNCATE linear_installations;"

          echo "PASS: four transport tables, and one active installation enforced"

      - name: Verify production reset cannot clear Linear transport state
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -c "
          from app import sql
          transport = ('linear_installations', 'linear_oauth_states', 'linear_agent_inbox', 'linear_agent_sessions')
          for table in transport:
              assert table not in sql.TRUNCATE_ALL_STATE, f'production reset would clear {table}'
              assert table in sql.TRUNCATE_ALL_TEST_STATE, f'deterministic cleanup misses {table}'
          print('PASS: production reset stays Linear-unaware; deterministic cleanup does not')
          "

      - name: Verify the deterministic ingress and OAuth callback contract
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: python -m pytest tests/test_linear_ingress.py -q

      # The worker, which is the half of T00W no ingress test can reach. Runs
      # with the same empty Linear environment as the provider step above, and
      # with no model credential either: every model invocation is a
      # FunctionModel and every provider call is a fake, so a path that silently
      # required NVIDIA, OpenAI, or a Linear credential fails here rather than
      # skipping.
      - name: Verify the deterministic AgentSession worker
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
          LINEAR_CLIENT_ID: ""
          LINEAR_CLIENT_SECRET: ""
          LINEAR_WEBHOOK_SECRET: ""
          LINEAR_ALLOWED_USER_ID: ""
          TRELLIS_PUBLIC_ORIGIN: ""
          NVIDIA_API_KEY: ""
        run: python -m pytest tests/test_linear_worker.py -q

      # The worker is a separate process, so "does it start" is a real question
      # that no unit test of its internals answers. Asserted structurally: the
      # module must be runnable with -m, and the FastAPI application must not
      # import it, because wiring the drain loop into a lifespan hook would
      # start one loop per Uvicorn worker process.
      - name: Verify the worker entry point exists and the web process does not start it
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          python -c "
          import importlib.util
          spec = importlib.util.find_spec('app.linear_agent_worker')
          assert spec is not None, 'the worker module is not importable as app.linear_agent_worker'
          from app import linear_agent_worker as w
          assert callable(w.main) and callable(w.run_forever)
          print('PASS: python -m app.linear_agent_worker has an entry point')
          "

          if grep -nE '^(from|import).*linear_agent_worker' app/main.py app/agent.py; then
            echo "FAIL: the web application imports the worker"
            echo "The worker is a separate systemd unit. Starting it from a FastAPI"
            echo "lifespan hook would run one drain loop per Uvicorn worker process."
            exit 1
          fi
          echo "PASS: the web process does not start the worker"

      # The whole cumulative suite, because T00W touches main.py, sql.py, and
      # config.py, and a route or statement change can break a gate that never
      # mentions Linear.
      - name: Verify the cumulative deterministic suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: python -m pytest -m "not network" -q

      - name: Verify the webhook path cannot reach Linear
        shell: bash
        run: |
          set -euo pipefail

          # Linear allows five seconds, and nothing on the ingress path needs a
          # provider round trip. Asserted structurally rather than by timing: the
          # ingress module must not import the provider boundary at all, so it
          # cannot call Linear even by accident.
          if grep -nE '^(from|import).*linear_agent_api' backend/app/linear_agent.py; then
            echo "FAIL: the webhook boundary imports the provider client"
            exit 1
          fi
          echo "PASS: ingress cannot reach Linear, because it cannot name it"

      - name: Remove CI database resources
        if: always()
        run: docker compose down -v

  t00l-linear-boundary:
    name: T00L Linear boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned backend dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -r backend/requirements.txt

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      # Runs before any database starts, because it needs none and fails fast.
      # A grep gate is crude, but the property it defends is exactly the kind a
      # green test suite cannot see: code that works offline today because the
      # network path is simply never exercised in CI.
      #
      # Amended at T00W under D-69. The job name is a required status check and
      # does not change. What changed is the shape of the assertion, in three
      # ways, and each is deliberate.
      #
      # 1. It now names the four actual provider endpoints instead of matching
      #    any string containing `linear.app`. The old pattern
      #    `api\.linear\.app|linear\.app/graphql` had a hole, because Linear's
      #    authorization endpoint is on `linear.app`, so a file could carry
      #    `https://linear.app/oauth/authorize` straight through a gate that
      #    advertised itself as exclusive. Banning the bare host instead would
      #    be the opposite error: Agent Activity content legitimately contains
      #    ordinary Linear links in Markdown, and what is being defended is
      #    remote provider egress, not any mention of Linear.
      #
      # 2. Exactly one file may hold such a literal,
      #    `backend/app/linear_agent_api.py`. Every other file failing this
      #    check is the finding. The assertion does not require that file to
      #    exist, which is what lets the D-69 re-plan commit stay green before
      #    the provider module is written.
      #
      # 3. The issue mutations and `LINEAR_API_KEY` stay banned everywhere in
      #    scope, including inside the provider boundary itself. The exemption
      #    covers endpoint literals only. T00W talks to Linear; it does not
      #    touch a Linear issue, and T26 through T29 still own that.
      #
      # The search stays scoped to backend/app/ and backend/migrations/ and must
      # never be widened to the repository. `backend/tests/fixtures/linear_contract.json`
      # contains `api.linear.app/graphql` and all four issue mutations as
      # legitimate T00B evidence, and a well-meant widening would break that
      # proof rather than strengthen this one.
      - name: Verify no remote Linear behavior outside the authorized boundary
        shell: bash
        run: |
          set -euo pipefail

          PROVIDER_ENDPOINTS='https://linear\.app/oauth/authorize|https://api\.linear\.app/oauth/(token|revoke)|https://api\.linear\.app/graphql'
          ALLOWED_BOUNDARY='backend/app/linear_agent_api.py'

          # `|| true` because grep exits 1 on no matches, which is the expected
          # state before T00W implementation lands and would otherwise trip
          # `set -e` into reporting success as a failure.
          # --exclude-dir and -I keep this on source rather than build output. A
          # compiled .pyc embeds the string constants of the module it came from,
          # so a __pycache__ left by any earlier step would report the boundary's
          # own literals as an offender in a second file. The gate is ordered
          # before anything imports the application today, but relying on step
          # order for correctness is exactly the kind of accident this file is
          # supposed to catch rather than depend on.
          offenders="$(grep -rlIE --exclude-dir=__pycache__ "$PROVIDER_ENDPOINTS" backend/app/ backend/migrations/ 2>/dev/null | grep -vFx "$ALLOWED_BOUNDARY" || true)"
          if [ -n "$offenders" ]; then
            echo "FAIL: Linear provider endpoint found outside $ALLOWED_BOUNDARY"
            echo "$offenders"
            echo "Reaching Linear from any other module is a D-69 violation."
            echo "Do not split, encode, or move the literal into configuration to evade this check."
            exit 1
          fi

          if grep -rniIE --exclude-dir=__pycache__ 'LINEAR_API_KEY|issueCreate|issueUpdate|issueArchive|issueUnarchive' \
               backend/app/ backend/migrations/ ; then
            echo "FAIL: Linear issue mutation or personal API key found in shipped application code"
            echo "Issue projection is T26 through T29 and remains deferred."
            exit 1
          fi

          for forbidden in backend/app/linear.py backend/app/projector.py backend/app/reconciler.py; do
            if [ -f "$forbidden" ]; then
              echo "FAIL: $forbidden belongs to T26 through T29 and must not exist yet"
              exit 1
            fi
          done

          echo "PASS: no projector, reconciler, personal API key, or issue mutation,"
          echo "PASS: and no provider endpoint outside $ALLOWED_BOUNDARY"

      # The production/test truncate split is load bearing and the two constants
      # differ by one table name, so a later edit could reconnect them without
      # any test noticing. Assert which statement each caller actually uses
      # rather than trusting that the names stayed apart. See D-68.
      - name: Verify the production and test truncate boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import sys

          sys.path.insert(0, "backend")
          from app import seed, sql

          problems = []

          if "linear_task_state" in sql.TRUNCATE_ALL_STATE:
              problems.append(
                  "TRUNCATE_ALL_STATE clears linear_task_state, which makes "
                  "POST /api/demo/reset Linear-aware. That is T29, behind the "
                  "D-28 projector fence, and is deferred."
              )
          if "linear_task_state" not in sql.TRUNCATE_ALL_TEST_STATE:
              problems.append(
                  "TRUNCATE_ALL_TEST_STATE does not clear linear_task_state, so "
                  "tombstoned divergence leaks between deterministic tests."
              )

          # seed.reset is the production caller and must keep the production
          # statement. Read the source rather than executing it.
          reset_source = pathlib.Path("backend/app/seed.py").read_text(encoding="utf-8")
          if "sql.TRUNCATE_ALL_TEST_STATE" in reset_source:
              problems.append("seed.py uses the test-only truncate statement")
          if "sql.TRUNCATE_ALL_STATE" not in reset_source:
              problems.append("seed.py no longer uses TRUNCATE_ALL_STATE")

          # Every deterministic fixture must use the test statement.
          for name in (
              "test_invariants.py",
              "test_approval_bridge.py",
              "test_t17_continuity.py",
          ):
              path = pathlib.Path("backend/tests") / name
              source = path.read_text(encoding="utf-8")
              if "sql.TRUNCATE_ALL_TEST_STATE" not in source:
                  problems.append(f"{name} does not use TRUNCATE_ALL_TEST_STATE")
              if "conn.execute(sql.TRUNCATE_ALL_STATE)" in source:
                  problems.append(f"{name} still calls the production truncate")

          if problems:
              raise SystemExit("truncate boundary broken:\n" + "\n".join(problems))
          print("PASS T00L: seed.reset keeps TRUNCATE_ALL_STATE, three fixtures use TRUNCATE_ALL_TEST_STATE")
          PY

      # Path 1: fresh bootstrap. An empty volume, both migrations applied in
      # filename order by the image entrypoint.
      - name: Start PostgreSQL from an empty volume and apply 001 then 002 then 003
        run: docker compose up -d --wait

      - name: Verify the exact cumulative schema and the deliberate absence of a task foreign key
        shell: bash
        run: |
          set -euo pipefail

          # Cumulative through T00W. The T00L assertions below are unchanged and
          # unaffected by 003_linear_agent.sql, which adds transport tables and
          # touches neither linear_task_state nor linear_projections. Only the
          # whole-schema table list moves, because the compose file now mounts a
          # third migration. See D-69.
          tables="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT string_agg(tablename, ',' ORDER BY tablename) FROM pg_tables WHERE schemaname = 'public';"; } | tr -d '\r')"
          test "$tables" = "agent_runs,approvals,linear_agent_inbox,linear_agent_sessions,linear_installations,linear_oauth_states,linear_projections,linear_task_state,task_events,tasks,tool_invocations"

          # The side table's exact shape, and the trigger that must exist.
          state_columns="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT string_agg(column_name, ',' ORDER BY ordinal_position) FROM information_schema.columns WHERE table_name = 'linear_task_state';"; } | tr -d '\r')"
          test "$state_columns" = "task_id,external_id,external_updated_at,diverged,last_reconciled_at"

          projection_columns="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT string_agg(column_name, ',' ORDER BY ordinal_position) FROM information_schema.columns WHERE table_name = 'linear_projections';"; } | tr -d '\r')"
          test "$projection_columns" = "event_id,task_id,operation,status,attempt_count,remote_id,last_error,created_at,completed_at"

          # D-26. linear_task_state must carry NO foreign key. A cascade would
          # destroy external_id in the same transaction that queues the archive
          # projection, and would delete the tombstone the undo refusal reads.
          # This is asserted rather than described, because re-adding the
          # constraint is a one-line regression that every other test survives.
          state_fks="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT count(*) FROM pg_constraint WHERE conrelid = 'linear_task_state'::regclass AND contype = 'f';"; } | tr -d '\r')"
          test "$state_fks" = "0"

          # linear_projections, by contrast, MUST reference task_events, which is
          # what makes the outbox row disappear with its event.
          projection_fks="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT count(*) FROM pg_constraint WHERE conrelid = 'linear_projections'::regclass AND contype = 'f' AND confrelid = 'task_events'::regclass;"; } | tr -d '\r')"
          test "$projection_fks" = "1"

          # No Linear metadata may appear on tasks. See D-26.
          leaked="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT count(*) FROM information_schema.columns WHERE table_name = 'tasks' AND (column_name LIKE '%external%' OR column_name LIKE '%diverg%' OR column_name LIKE '%linear%');"; } | tr -d '\r')"
          test "$leaked" = "0"

          trigger="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT count(*) FROM pg_trigger WHERE tgname = 'task_events_linear_projection';"; } | tr -d '\r')"
          test "$trigger" = "1"

          echo "PASS T00L: fresh bootstrap applied 001 then 002, side table has no task foreign key, tasks carries no Linear column"

      - name: Verify the four event-to-projection mappings and trigger atomicity
        shell: bash
        run: |
          set -euo pipefail

          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis <<'SQL'
          INSERT INTO tasks (id, owner_id, title)
          VALUES ('11111111-1111-1111-1111-111111111111', '00000000-0000-0000-0000-000000000001', 'Task A');
          INSERT INTO task_events (task_id, actor_id, operation, before, after) VALUES
            ('11111111-1111-1111-1111-111111111111','00000000-0000-0000-0000-000000000001','created',NULL,'{"version":1}'),
            ('11111111-1111-1111-1111-111111111111','00000000-0000-0000-0000-000000000001','updated','{"version":1}','{"version":2}'),
            ('11111111-1111-1111-1111-111111111111','00000000-0000-0000-0000-000000000001','deleted','{"version":2}',NULL),
            ('11111111-1111-1111-1111-111111111111','00000000-0000-0000-0000-000000000001','restored',NULL,'{"version":3}');
          SQL

          # restored maps to unarchive, never to update. Collapsing it leaves the
          # Linear issue archived while the local board shows the task back.
          mapping="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT string_agg(e.operation || '->' || p.operation, ',' ORDER BY e.id) FROM task_events e JOIN linear_projections p ON p.event_id = e.id;"; } | tr -d '\r')"
          test "$mapping" = "created->create,updated->update,deleted->archive,restored->unarchive"

          # Atomicity, both directions. The projection must exist inside the
          # same transaction as its event, and a rolled-back event must leave no
          # projection behind.
          atomic="$({ docker compose exec -T postgres psql -At -U trellis -d trellis <<'SQL'
          BEGIN;
          INSERT INTO task_events (task_id, actor_id, operation, before, after)
          VALUES ('11111111-1111-1111-1111-111111111111','00000000-0000-0000-0000-000000000001','updated','{"version":3}','{"version":4}');
          SELECT 'intxn=' || count(*) FROM linear_projections p JOIN task_events e ON e.id = p.event_id WHERE e.after = '{"version":4}';
          ROLLBACK;
          SELECT 'afterrollback=' || count(*) FROM task_events WHERE after = '{"version":4}';
          SELECT 'orphans=' || count(*) FROM linear_projections p LEFT JOIN task_events e ON e.id = p.event_id WHERE e.id IS NULL;
          SQL
          } | tr -d '\r' | tr '\n' ' ')"
          echo "$atomic" | grep -q 'intxn=1'
          echo "$atomic" | grep -q 'afterrollback=0'
          echo "$atomic" | grep -q 'orphans=0'

          # The tombstone outlives its task, and the production truncate does not
          # clear it while the cascade does reach the outbox.
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis <<'SQL'
          INSERT INTO linear_task_state (task_id, external_id, diverged)
          VALUES ('11111111-1111-1111-1111-111111111111', 'TRE-1', true);
          DELETE FROM tasks WHERE id = '11111111-1111-1111-1111-111111111111';
          SQL

          survived="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT count(*) FROM linear_task_state WHERE task_id = '11111111-1111-1111-1111-111111111111' AND diverged AND external_id = 'TRE-1';"; } | tr -d '\r')"
          test "$survived" = "1"

          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis -c \
            "TRUNCATE TABLE tasks, task_events, agent_runs, tool_invocations, approvals RESTART IDENTITY CASCADE;"

          after_reset="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT (SELECT count(*) FROM linear_projections) || '|' || (SELECT count(*) FROM linear_task_state);"; } | tr -d '\r')"
          test "$after_reset" = "0|1"

          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis -c \
            "TRUNCATE TABLE tasks, task_events, agent_runs, tool_invocations, approvals, linear_task_state RESTART IDENTITY CASCADE;"

          after_test_reset="$({ docker compose exec -T postgres psql -At -U trellis -d trellis -c \
            "SELECT count(*) FROM linear_task_state;"; } | tr -d '\r')"
          test "$after_test_reset" = "0"

          echo "PASS T00L: four mappings, projection atomic with its event, rollback leaves none, tombstone survives task deletion and production reset"

      # Path 2: an existing 001-only database is upgraded by executing 002
      # explicitly. A second `docker compose up` is not an upgrade mechanism,
      # because the entrypoint skips a populated volume, so this uses a separate
      # database built from 001 alone and then upgraded in place.
      - name: Verify the existing-database upgrade path
        shell: bash
        run: |
          set -euo pipefail

          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d postgres -c "CREATE DATABASE trellis_upgrade;"
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis_upgrade < backend/migrations/001_init.sql

          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis_upgrade <<'SQL'
          INSERT INTO tasks (id, owner_id, title, notes) VALUES
            ('33333333-3333-3333-3333-333333333333','00000000-0000-0000-0000-000000000001','Legacy A','pre-upgrade'),
            ('44444444-4444-4444-4444-444444444444','00000000-0000-0000-0000-000000000001','Legacy B','pre-upgrade');
          INSERT INTO task_events (task_id, actor_id, operation, before, after) VALUES
            ('33333333-3333-3333-3333-333333333333','00000000-0000-0000-0000-000000000001','created',NULL,'{"version":1}'),
            ('44444444-4444-4444-4444-444444444444','00000000-0000-0000-0000-000000000001','created',NULL,'{"version":1}'),
            ('33333333-3333-3333-3333-333333333333','00000000-0000-0000-0000-000000000001','updated','{"version":1}','{"version":2}');
          SQL

          before_columns="$({ docker compose exec -T postgres psql -At -U trellis -d trellis_upgrade -c \
            "SELECT string_agg(table_name || '.' || column_name, ',' ORDER BY table_name, ordinal_position) FROM information_schema.columns WHERE table_schema = 'public';"; } | tr -d '\r')"

          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis_upgrade < backend/migrations/002_linear.sql

          # Existing business rows survive, and the business schema is byte
          # identical. Comparing the full column list catches an accidental
          # ALTER TABLE that a table count would miss.
          preserved="$({ docker compose exec -T postgres psql -At -U trellis -d trellis_upgrade -c \
            "SELECT (SELECT count(*) FROM tasks) || '|' || (SELECT count(*) FROM task_events);"; } | tr -d '\r')"
          test "$preserved" = "2|3"

          after_columns="$({ docker compose exec -T postgres psql -At -U trellis -d trellis_upgrade -c \
            "SELECT string_agg(table_name || '.' || column_name, ',' ORDER BY table_name, ordinal_position) FROM information_schema.columns WHERE table_schema = 'public' AND table_name IN ('tasks','task_events','agent_runs','tool_invocations','approvals');"; } | tr -d '\r')"
          test "$before_columns" = "$after_columns"

          # Historical events predate the trigger and must NOT be backfilled.
          # Backfilling would replay the entire audit log into Linear the first
          # time the projector ran.
          backfilled="$({ docker compose exec -T postgres psql -At -U trellis -d trellis_upgrade -c \
            "SELECT count(*) FROM linear_projections;"; } | tr -d '\r')"
          test "$backfilled" = "0"

          # New events on the upgraded database do project.
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d trellis_upgrade -c \
            "INSERT INTO task_events (task_id, actor_id, operation, before, after) VALUES ('33333333-3333-3333-3333-333333333333','00000000-0000-0000-0000-000000000001','deleted','{\"version\":2}',NULL);"

          projected="$({ docker compose exec -T postgres psql -At -U trellis -d trellis_upgrade -c \
            "SELECT count(*) || '|' || max(operation::text) FROM linear_projections;"; } | tr -d '\r')"
          test "$projected" = "1|archive"

          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U trellis -d postgres -c "DROP DATABASE trellis_upgrade;"

          echo "PASS T00L: 001-only database upgraded in place, rows and business schema preserved, history not backfilled, new events project"

      - name: Verify the T00L divergence invariants and the cumulative suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: |
          python -m ruff check .
          pytest tests/test_invariants.py -v -k "diverged"
          pytest -m "not network"

      # D-29 concluded the named invariant suite at fifteen. Assert the count so
      # that a sixteenth arriving by accretion, which is the outcome D-29 exists
      # to prevent, fails here rather than passing unnoticed.
      - name: Verify the named invariant suite is exactly fifteen
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        shell: bash
        run: |
          set -euo pipefail
          collected="$(pytest tests/test_invariants.py --collect-only -q | grep -c '::test_' || true)"
          test "$collected" = "15" || {
            echo "FAIL T00L: D-29 fixes the named invariant count at fifteen, collected $collected"
            exit 1
          }
          echo "PASS T00L: fifteen named invariants, per D-29"

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Remove CI database resources
        if: always()
        run: docker compose down -v

  d71-task-history-agent:
    name: D71 task history agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
