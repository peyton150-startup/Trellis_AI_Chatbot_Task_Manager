        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify the chat and board completion wiring
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from "node:fs";

          const load = (path) => {
            if (!fs.existsSync(path)) {
              throw new Error(`${path} does not exist`);
            }
            return fs.readFileSync(path, "utf8");
          };
          const requireMatch = (source, pattern, message) => {
            if (!pattern.test(source)) {
              throw new Error(message);
            }
          };

          const page = load("app/page.tsx");
          const board = load("components/Board.tsx");
          const chat = load("components/Chat.tsx");
          const trellisAgent = load("lib/TrellisHttpAgent.ts");

          if ((page.match(/useBoard\s*\(/g) ?? []).length !== 1) {
            throw new Error("page.tsx must own one useBoard instance");
          }
          requireMatch(page, /<Board\s+state=\{board\}\s*\/>/, "page.tsx must pass the board state to Board");
          requireMatch(
            page,
            /<Chat\s+onRunComplete=\{board\.refetch\}\s*\/>/,
            "page.tsx must connect Chat completion to board.refetch",
          );
          if (/useBoard\s*\(/.test(board)) {
            throw new Error("Board.tsx must consume BoardState rather than create a second board store");
          }

          requireMatch(
            chat,
            /new TrellisHttpAgent\s*\(\s*\{[\s\S]*?url:\s*["']\/api\/agui["']/,
            "Chat.tsx must create one TrellisHttpAgent for the relative /api/agui endpoint",
          );
          requireMatch(
            trellisAgent,
            /class\s+TrellisHttpAgent\s+extends\s+HttpAgent/,
            "TrellisHttpAgent must preserve the HttpAgent transport contract",
          );
          requireMatch(
            chat,
            /useAgUiRuntime\s*\(\s*\{\s*agent(?:\s*,[\s\S]*?)?\}\s*\)/,
            "Chat.tsx must use the AG-UI runtime",
          );
          requireMatch(
            chat,
            /useAuiEvent\s*\(\s*["']thread\.runEnd["'][\s\S]*?onRunComplete\s*\(/,
            "thread.runEnd must trigger the board completion callback",
          );
          requireMatch(
            chat,
            /import\s*\{\s*Thread\s*\}\s*from\s*["']@\/components\/thread["']/,
            "Chat.tsx must import the official generated assistant-ui Thread",
          );
          requireMatch(chat, /<AssistantRuntimeProvider\s+runtime=\{runtime\}>/, "Chat.tsx must provide the runtime");
          requireMatch(chat, /<Thread\b/, "Chat.tsx must render the official generated assistant-ui Thread");
          if (/\b(?:Thread|Composer|Message)Primitive\b/.test(chat)) {
            throw new Error("Chat.tsx must not hand-compose thread, composer, or message primitives");
          }
          console.log("PASS T14: one board store, official assistant-ui Thread, relative AG-UI transport, and run-end refetch are wired");
          JS

