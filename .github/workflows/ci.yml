          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -r backend/requirements.txt

      - name: Start PostgreSQL and apply migrations
        run: docker compose up -d --wait

      - name: Verify D-71 task history mechanics and capability profiles
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: |
          python -m ruff check \
            app/prompts.py \
            tests/test_task_history_tool.py \
            tests/test_models.py \
            tests/test_linear_worker.py

          python -m pytest tests/test_task_history_tool.py -q

          python -m pytest \
            tests/test_models.py::test_get_task_history_arguments_match_history_contract \
            tests/test_models.py::test_list_tasks_enforces_limit_bounds \
            -q

          # D-71 owns "history is registered on both profiles, and Linear still
          # withholds the destructive tools". It deliberately does not assert the
          # exact current profile sets, because that set belongs to whichever
          # decision last changed it. D-73 owns the exact sets.
          python -m pytest \
            tests/test_linear_worker.py::test_history_is_registered_on_both_profiles \
            tests/test_linear_worker.py::test_the_linear_profile_withholds_destructive_tools \
            -q

      - name: Verify D-71 model-facing history navigation contract
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from app.prompts import SYSTEM_PROMPT

          prompt = " ".join(SYSTEM_PROMPT.split()).lower()

          required = (
              "reuse authoritative task ids already present in canonical trellis history",
              "reuse that id directly with get_task_history",
              "do not call list_tasks merely to rediscover",
              "server-side actor scope remains authoritative",
              "a task absent from a bounded list_tasks result is not proof",
              "request limit=50",
              "until next_before_event_id is null",
              "combine all returned pages",
              "oldest to newest",
              "do not reconstruct a v1 snapshot",
              "history is read-only",
          )

          missing = [fragment for fragment in required if fragment not in prompt]

          if missing:
              raise SystemExit(
                  "D-71 history navigation contract is incomplete:\n- "
                  + "\n- ".join(missing)
              )

          print("PASS D-71 model-facing history navigation contract")
          PY

      # This gate proves the deterministic application contract: the tool,
      # schemas, capability profiles, and prompt instructions support D-71.
      # It deliberately does not claim that any particular LLM will always
      # choose the optimal tool path; model compliance belongs to eval/demo
      # testing rather than deterministic CI.
      - name: Report D-71 deterministic boundary
        run: |
          echo "PASS D71: task history mechanics, argument bounds,"
          echo "PASS D71: history registered on both profiles with Linear still"
          echo "PASS D71: withholding destructive tools,"
          echo "PASS D71: and model-facing navigation instructions are pinned"

      - name: Remove CI database resources
        if: always()
        run: docker compose down -v

