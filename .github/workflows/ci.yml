  d75-run-history-data-movement:
    name: D75 run history data movement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned backend dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -r backend/requirements.txt

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start PostgreSQL and apply migration
        run: docker compose up -d --wait

      # The authority half. Narrowing a read must not narrow who may perform
      # it, so the refusal shape is what this gate pins: owned yields history,
      # while foreign and missing remain one indistinguishable refusal.
      - name: Prove the narrowed reads keep their ownership predicates
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: |
          python -m ruff check app/runs.py app/sql.py app/agent.py app/idempotency.py app/linear_agent_worker.py tests/test_d75_run_history.py
          pytest tests/test_d75_run_history.py -v
          pytest tests/test_t17_continuity.py -v

      # The statement half. These three predicates carry the whole D-67
      # refusal contract, and a future tidy-up that drops one is invisible to
      # any test that only exercises the happy path.
      - name: Prove the continuation statement keeps its predicates
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'AND predecessor.actor_id = %(actor_id)s' backend/app/sql.py \
            || { echo "FAIL continuation insert lost its actor predicate"; exit 1; }

          grep -Fq "AND predecessor.status = 'completed'" backend/app/sql.py \
            || { echo "FAIL continuation insert lost its completed predicate"; exit 1; }

          grep -Fq 'RETURNING id, message_history;' backend/app/sql.py \
            || { echo "FAIL continuation insert no longer returns the starting snapshot"; exit 1; }

          grep -Fq 'AND actor_id = %(actor_id)s' backend/app/sql.py \
            || { echo "FAIL a narrowed run read lost its actor predicate"; exit 1; }

          if grep -Fq 'INSERT_RUN_WITH_HISTORY' backend/app/sql.py; then
            echo "FAIL the superseded two-step continuation insert is back"
            exit 1
          fi

          echo "PASS D75 continuation statement predicates"

      - name: Run cumulative non-network backend suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: pytest -m "not network"

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Report the run history data movement boundary
        run: |
          echo "PASS D75: continuation authorizes, copies canonical history, and"
          echo "PASS D75: creates the successor in one statement, returning the"
          echo "PASS D75: starting snapshot so no caller re-reads what it wrote"
          echo "PASS D75: history and ownership reads select what they need, with"
          echo "PASS D75: every actor predicate intact and mutation-proven"

      - name: Remove CI database resources
        if: always()
        run: docker compose down -v

  d76-run-relative-undo-bridge:
    name: D76 run relative undo bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned backend dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -r backend/requirements.txt

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start PostgreSQL and apply migration
        run: docker compose up -d --wait

      # Targeting, eligibility, atomicity, identity, the ABA regression, the
      # concurrency race, the AG-UI stream, and the canonical history round
      # trip. No NVIDIA key is set for this job, deliberately: the control path
      # must not need one, and the suite makes provider construction itself a
      # failure.
      - name: Prove the deterministic undo control path
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: |
          python -m ruff check app/agent.py app/runs.py app/undo.py app/sql.py app/prompts.py tests/test_d76_undo_bridge.py
          pytest tests/test_d76_undo_bridge.py -v

      # The two locators are the whole decision, and the failure mode is a
      # future tidy-up collapsing them back into one value. Neither a passing
      # happy path nor a type checker would notice.
      - name: Prove the two run locators stay separate and server resolved
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '_PREVIOUS_RUN_KEY = "trellisPreviousRunId"' backend/app/agent.py \
            || { echo "FAIL the previous-run locator lost its distinct key"; exit 1; }

          grep -Fq '_CONTINUITY_RUN_KEY = "trellisContinuityRunId"' backend/app/agent.py \
            || { echo "FAIL the continuity locator lost its distinct key"; exit 1; }

          grep -Fq 'PREVIOUS_RUN_KEY = "trellisPreviousRunId"' frontend/lib/TrellisHttpAgent.ts \
            || { echo "FAIL the browser stopped forwarding a distinct previous-run key"; exit 1; }

          grep -Fq 'forwardedProps[PREVIOUS_RUN_KEY] = previousRunId' frontend/lib/TrellisHttpAgent.ts \
            || { echo "FAIL the previous-run locator is not assigned at the top level"; exit 1; }

          grep -Fq 'agent.setPreviousRunId(event.threadId)' frontend/components/Chat.tsx \
            || { echo "FAIL the previous-run cursor no longer advances on RUN_STARTED"; exit 1; }

          # Continuity promotion must stay completed-only. If this ever moves,
          # a failed run becomes a history predecessor and D-67 is weakened.
          grep -Fq 'detail.status === "completed"' frontend/components/Chat.tsx \
            || { echo "FAIL continuity promotion is no longer completed-only"; exit 1; }

          grep -Fq 'FOR UPDATE;' backend/app/sql.py \
            || { echo "FAIL the undo serialization lock is gone"; exit 1; }

          grep -Fq 'undo.undo_run_on_conn(run_id, actor_id, conn=conn)' backend/app/runs.py \
            || { echo "FAIL the authoritative attempt no longer runs the kernel under its own lock"; exit 1; }

          # The control path must not construct an agent, and the undo kernel
          # must not learn to restore at the old version number.
          if grep -Fq 'AGUIAdapter(get_agent()' backend/app/agent.py; then
            if grep -A 40 'async def _handle_undo_previous' backend/app/agent.py | grep -Fq 'get_agent'; then
              echo "FAIL the control path constructs the model agent"
              exit 1
            fi
          fi

          grep -Fq 'restored_version = _event_version(event.before) + 1' backend/app/undo.py \
            || { echo "FAIL restoration no longer advances the concurrency version"; exit 1; }

          echo "PASS D76 locator, lock, and version predicates"

      - name: Prove the browser forwarded-property contract
        working-directory: frontend
        run: npm run test:transport

      - name: Run cumulative non-network backend suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: pytest -m "not network"

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Remove CI database resources
        if: always()
        run: docker compose down -v

  d77-current-state-truth:
    name: D77 current state truth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node 22.23.2
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned backend dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python -m pip install -r backend/requirements.txt

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start PostgreSQL and apply migration
        run: docker compose up -d --wait

      # The delete postcondition, replay equivalence, duplicate membership from
      # current rows only, filter-before-group, membership-before-limit, and the
      # D-76 x D-77 restore-rejoins-the-group sequence.
      - name: Prove current-state truth and bounded duplicate reads
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: |
          python -m ruff check app/tools.py app/domain.py app/models.py app/sql.py app/prompts.py tests/test_d77_current_state.py
          pytest tests/test_d77_current_state.py -v

      # Stage order in the duplicate statement is its correctness condition, and
      # every one of these is invisible to a test that only checks the happy
      # path with a handful of rows.
      - name: Prove the duplicate statement keeps its stage order and scope
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'count(*) OVER (PARTITION BY lower(title)) AS duplicate_count' backend/app/sql.py \
            || { echo "FAIL duplicate membership is no longer whole-title, case-insensitive, and SQL-owned"; exit 1; }

          # LIMIT must come after the duplicate predicate. If grouping ever
          # moved behind the page bound, an empty result would stop being a
          # proof.
          python - <<'PY'
          import re, sys, pathlib
          src = pathlib.Path("backend/app/sql.py").read_text(encoding="utf-8")
          match = re.search(
              r'SELECT_DUPLICATE_TASKS_FOR_OWNER = """(.*?)"""', src, re.S
          )
          if match is None:
              sys.exit("FAIL the duplicate statement is gone")
          body = match.group(1)
          for needle in ("owner_id = %(owner_id)s", "duplicate_count > 1", "LIMIT %(limit)s"):
              if needle not in body:
                  sys.exit(f"FAIL the duplicate statement lost {needle!r}")
          if not (
              body.index("owner_id = %(owner_id)s")
              < body.index("duplicate_count > 1")
              < body.index("LIMIT %(limit)s")
          ):
              sys.exit("FAIL filters, duplicate membership, and LIMIT are out of order")
          if "marked.*" in body or "SELECT *\n  FROM marked" in body:
              sys.exit("FAIL the internal duplicate_count can reach Task.model_validate")
          print("PASS duplicate statement stage order")
          PY

          # Enrichment must precede lease completion, or an original call and a
          # replay produce two different canonical histories.
          python - <<'PY'
          import sys, pathlib
          src = pathlib.Path("backend/app/tools.py").read_text(encoding="utf-8")
          enrich = src.index("result = [_deleted_snapshot(task) for task in mutation.tasks]")
          complete = src.index("idempotency.complete", enrich)
          if enrich >= complete:
              sys.exit("FAIL the delete result is enriched after idempotency.complete")
          print("PASS delete enrichment precedes lease completion")
          PY

          # No soft delete crept in.
          if grep -Eq "TaskStatus\.DELETED|'deleted'::task_status" backend/app/models.py backend/app/sql.py; then
            echo "FAIL a deleted task status was introduced"
            exit 1
          fi

          if ls backend/migrations/*.sql | grep -qv -e 001_init -e 002_linear -e 003_linear_agent; then
            echo "FAIL D-77 introduced a migration"
            exit 1
          fi

          echo "PASS D77 statement, ordering, and no-migration predicates"

      - name: Prove the model-visible tool profile did not grow
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from app import agent
          from app.models import ToolName
          if len(agent.ALL_TOOLS) != 8:
              sys.exit(f"FAIL the browser profile is {len(agent.ALL_TOOLS)} tools, not 8")
          if len(agent.LINEAR_TOOLS) != 6:
              sys.exit(f"FAIL the Linear profile is {len(agent.LINEAR_TOOLS)} tools, not 6")
          names = {name.value for name in ToolName}
          for forbidden in ("undo", "undo_tasks", "recover_tasks", "restore_tasks"):
              if forbidden in names:
                  sys.exit(f"FAIL {forbidden} became a model tool")
          print("PASS eight browser tools, six Linear tools, no undo tool")
          PY

      - name: Run cumulative non-network backend suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://trellis:trellis@localhost:55432/trellis
        run: pytest -m "not network"

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Remove CI database resources
        if: always()
        run: docker compose down -v
